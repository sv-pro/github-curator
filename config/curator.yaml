intent:
  default_weights:
    architectural_maturity: 0.3
    autonomy_level: 0.3
    safety: 0.2
    documentation: 0.2

  constraints:
    min_stars: 20
    max_age_months: 18
    requires_license: false

github:
  search_limit: 100
  context_files:
    - README.md
    - ARCHITECTURE.md
    - docs/
    - examples/
  rate_limit_buffer: 10

  # Adaptive search strategy
  adaptive_search:
    enabled: true
    target_repo_count: 30
    min_repo_count: 20
    max_repo_count: 50
    max_iterations: 5
    initial_queries_count: 3
    # Constraint adjustment per iteration
    stars_adjustment: 10
    age_adjustment_months: 2

evaluation:
  confidence_threshold_high: 0.7
  confidence_threshold_low: 0.4
  min_indicators_found: 2

validation:
  strict_mode: false
  fail_on_warnings: false

reflection:
  min_evaluations_for_patterns: 10
  correlation_threshold: 0.7

output:
  formats:
    - markdown
    - json
    - html_trace
  trace_detail: full
