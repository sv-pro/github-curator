intent:
  default_weights:
    architectural_maturity: 0.3
    autonomy_level: 0.3
    safety: 0.2
    documentation: 0.2

  constraints:
    min_stars: 20
    max_age_months: 18
    requires_license: false

github:
  search_limit: 100
  context_files:
    - README.md
    - ARCHITECTURE.md
    - docs/
    - examples/
  rate_limit_buffer: 10

  # Adaptive search strategy
  adaptive_search:
    enabled: true
    target_repo_count: 30
    min_repo_count: 20
    max_repo_count: 50
    max_iterations: 5
    initial_queries_count: 3
    # Constraint adjustment per iteration
    stars_adjustment: 10
    age_adjustment_months: 2

# Smart Repo Fetcher - Adaptive multi-stage analysis
# Reduces API calls by 50-70%, costs by 60-80%, and increases speed by 3-5x
smart_fetch:
  # Enable smart fetching (vs. brute force evaluation)
  enabled: true

  # Stage 1: Metadata filtering
  enable_metadata_filter: true
  min_stars_multiplier: 0.5  # Skip if < 50% of min_stars threshold
  max_size_kb: 500000        # Skip huge repos (500MB+)
  min_size_kb: 50            # Skip tiny repos (<50KB)

  # Stage 2: Lightweight analysis
  enable_quick_llm: false      # Enable LLM quick check for uncertain cases
  quick_model: claude-3-haiku-20240307  # Cheapest model for quick checks
  min_quick_score: 0.3       # Skip if relevance score < 30%
  high_promise_score: 0.7    # Fast-track if relevance score > 70%
  readme_max_lines: 500      # Read only first N lines of README

  # Stage 4: Code analysis (optional deep inspection)
  clone_threshold_score: 0.8      # Clone if evaluation score > 0.8
  clone_threshold_confidence: 0.6 # AND confidence < 0.6 (need more evidence)

evaluation:
  confidence_threshold_high: 0.7
  confidence_threshold_low: 0.4
  min_indicators_found: 2

llm:
  # Default provider: anthropic, openai, google, ollama
  # Can be overridden with CURATOR_LLM_PROVIDER environment variable
  provider: anthropic

  # Use LangChain for unified provider interface (recommended)
  use_langchain: true

  # Model configuration (optional, uses provider defaults if not specified)
  models:
    anthropic: claude-sonnet-4-5-20250929
    openai: gpt-4o
    google: gemini-2.0-flash-exp
    ollama: llama3.3

  # Provider-specific settings
  providers:
    ollama:
      base_url: http://localhost:11434

  # Fallback providers (if primary fails)
  fallback_enabled: false
  fallback_providers:
    - openai
    - google

validation:
  strict_mode: false
  fail_on_warnings: false

reflection:
  min_evaluations_for_patterns: 10
  correlation_threshold: 0.7

output:
  formats:
    - markdown
    - json
    - html_trace
  trace_detail: full
